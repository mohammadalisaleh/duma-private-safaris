<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BabySafe+ Spin &amp; Win!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1f7a85;
    --navy-light: #2a9aaa;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 16px 48px;
    position: relative;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 26px;
    z-index: 10;
    position: relative;
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 14px;
  }
  .logo-img {
    display: block;
    width: 100%;
    max-width: 260px;
    height: auto;
  }
  .instruction {
    font-size: 13.5px;
    color: var(--navy);
    opacity: 0.7;
    font-weight: 600;
  }

  /* Main layout */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    position: relative;
    padding: 0 16px;
    width: 100%;
  }

  /* Wheel container */
  .wheel-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 56px;
    touch-action: manipulation;
  }

  .wheel-glow {
    position: absolute;
    top: 56px;
    width: 110%;
    height: 110%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(31,122,133,0.18) 0%, transparent 70%);
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  #wheelCanvas {
    display: block;
    filter: drop-shadow(0 8px 32px rgba(26,58,107,0.2));
    border-radius: 50%;
  }

  /* Pointer — hovers above wheel, tip just touches the rim */
  .pointer {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 40px solid var(--navy);
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.35));
    z-index: 20;
  }

  /* Center button */
  .spin-btn {
    position: absolute;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--white);
    border: 4px solid var(--navy);
    color: var(--navy);
    font-family: 'Baloo 2', cursive;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    z-index: 20;
    box-shadow: 0 4px 16px rgba(31,122,133,0.35), 0 2px 4px rgba(0,0,0,0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    letter-spacing: 0.5px;
    line-height: 1.1;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .spin-btn:active {
    transform: scale(0.93);
    box-shadow: 0 2px 8px rgba(31,122,133,0.3);
  }
  .spin-btn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 58, 107, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    padding: 20px;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .modal-card {
    background: white;
    border-radius: 32px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    transform: scale(0.8) translateY(30px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0,0,0,0.2);
  }
  .modal-overlay.active .modal-card {
    transform: scale(1) translateY(0);
  }
  .modal-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg, var(--navy), var(--navy-light), var(--navy));
  }
  .modal-title {
    font-family: 'Baloo 2', cursive;
    font-size: 16px;
    color: var(--navy);
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
    margin-top: 10px;
  }
  .modal-prize {
    font-family: 'Baloo 2', cursive;
    font-size: 28px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.25;
    margin-bottom: 20px;
  }
  .modal-prize.consolation {
    color: #888;
    font-size: 24px;
  }
  .modal-sub {
    font-size: 14px;
    color: #666;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .modal-btn {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(26,58,107,0.3);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .modal-btn:active { transform: scale(0.96); }
  .modal-confetti {
    position: absolute;
    pointer-events: none;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0;
    animation: confettiFall 1.5s ease-in forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
  }

  @media (max-height: 700px) {
    .header { margin-bottom: 14px; }
    .logo-fallback { font-size: 24px; }
  }
</style>
</head>

<script>
const SEGMENTS = [
  { label: "BUNDLE\nDEAL!\n1,000/-",       short: "Bundle deal! Full size set for 1,000 only!", type: "win" },
  { label: "SPIN\nAGAIN!",                 short: "Spin again!",                                 type: "again" },
  { label: "BETTER\nLUCK\nNEXT TIME",      short: "Better luck next time",                       type: "loss" },
  { label: "FREE\nMINI\nGIFT",             short: "Free mini gift",                              type: "win" },
  { label: "KSH 100\nOFF",                 short: "KSH 100 off",                                 type: "win" },
  { label: "KSH 50\nOFF",                  short: "KSH 50 off",                                  type: "win" },
  { label: "KSH 100\nOFF NEXT\nPURCHASE",  short: "KSH 100 off your next purchase",              type: "win" },
  { label: "KSH 50\nOFF NEXT\nPURCHASE",   short: "KSH 50 off your next purchase",               type: "win" },
  { label: "BUY 2\nGET KSH 100\nOFF",      short: "Buy two, get KSH 100 off",                    type: "win" },
  { label: "BUY 2\nGET KSH 50\nOFF",       short: "Buy two, get KSH 50 off",                     type: "win" },
];

// Just blue (navy) and white, alternating
const COLORS = [
  "#1f7a85", "#FFFFFF",
  "#1f7a85", "#FFFFFF",
  "#1f7a85", "#FFFFFF",
  "#1f7a85", "#FFFFFF",
  "#1f7a85", "#FFFFFF",
];
const TEXT_COLORS = [
  "#FFFFFF", "#1f7a85",
  "#FFFFFF", "#1f7a85",
  "#FFFFFF", "#1f7a85",
  "#FFFFFF", "#1f7a85",
  "#FFFFFF", "#1f7a85",
];

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');

const NUM = SEGMENTS.length;
const ARC = (2 * Math.PI) / NUM;

let SIZE, R, CENTER;
let currentAngle = 0;
let spinning = false;

function getWheelSize() {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const maxFromH = vh * 0.62;
  const maxFromW = vw * 0.82;
  return Math.min(maxFromH, maxFromW, 480);
}

// Sizes the canvas backing store for the device's pixel ratio so the wheel
// stays crisp on retina screens (all modern iPads/iPhones), and keeps
// R/CENTER in sync whenever the wheel is resized (e.g. iPad rotation).
function setupCanvas() {
  SIZE = getWheelSize();
  R = SIZE / 2;
  CENTER = R;
  const dpr = Math.max(window.devicePixelRatio || 1, 1);
  canvas.width = SIZE * dpr;
  canvas.height = SIZE * dpr;
  canvas.style.width = SIZE + 'px';
  canvas.style.height = SIZE + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawWheel(angle) {
  ctx.clearRect(0, 0, SIZE, SIZE);

  ctx.save();
  ctx.shadowColor = 'rgba(26,58,107,0.3)';
  ctx.shadowBlur = 24;
  ctx.beginPath();
  ctx.arc(CENTER, CENTER, R - 4, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  for (let i = 0; i < NUM; i++) {
    const startAngle = angle + i * ARC;
    const endAngle = startAngle + ARC;
    const mid = startAngle + ARC / 2;

    ctx.beginPath();
    ctx.moveTo(CENTER, CENTER);
    ctx.arc(CENTER, CENTER, R - 6, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = COLORS[i];
    ctx.fill();

    ctx.strokeStyle = '#1f7a85';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.save();
    ctx.translate(CENTER, CENTER);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.fillStyle = TEXT_COLORS[i];

    const lines = SEGMENTS[i].label.split('\n');
    const lineH = SIZE < 400 ? 12 : 14;
    const totalH = lines.length * lineH;
    const startY = -totalH / 2 + lineH * 0.5;
    const fontSz = SIZE < 400 ? 11 : (lines.length > 2 ? 11 : 13);

    ctx.font = `800 ${fontSz}px 'Nunito', sans-serif`;
    lines.forEach((line, li) => {
      ctx.fillText(line, R - 20, startY + li * lineH);
    });
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(CENTER, CENTER, R - 5, 0, 2 * Math.PI);
  ctx.strokeStyle = '#1f7a85';
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(CENTER, CENTER, 46, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#1f7a85';
  ctx.lineWidth = 3;
  ctx.stroke();
}

setupCanvas();
drawWheel(currentAngle);

let targetAngle = 0;

function spinWheel() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const winner = Math.floor(Math.random() * NUM);

  const extraSpins = (5 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
  const rawTarget = -Math.PI / 2 - winner * ARC - ARC / 2;
  let normalizedTarget = rawTarget;
  while (normalizedTarget <= currentAngle + extraSpins - 2 * Math.PI) {
    normalizedTarget += 2 * Math.PI;
  }
  targetAngle = normalizedTarget + extraSpins;

  const startAngle = currentAngle;
  const duration = 4500 + Math.random() * 1000;
  const startTime = performance.now();

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = easeOut(progress);
    currentAngle = startAngle + (targetAngle - startAngle) * eased;
    drawWheel(currentAngle);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = targetAngle;
      spinning = false;
      showResult(winner);
    }
  }

  requestAnimationFrame(animate);
}

function showResult(index) {
  const seg = SEGMENTS[index];
  const overlay = document.getElementById('modalOverlay');
  const titleEl = document.getElementById('modalTitle');
  const prizeEl = document.getElementById('modalPrize');
  const subEl = document.getElementById('modalSub');

  prizeEl.className = 'modal-prize';

  if (seg.type === 'win') {
    titleEl.textContent = "You Won!";
    prizeEl.textContent = seg.short;
    subEl.textContent = "Show this screen to our team to claim your prize";
    launchConfetti();
  } else if (seg.type === 'again') {
    titleEl.textContent = "Lucky You!";
    prizeEl.textContent = "Spin Again!";
    subEl.textContent = "You get another chance — go for it!";
  } else {
    titleEl.textContent = "So Close!";
    prizeEl.textContent = seg.short;
    prizeEl.className = 'modal-prize consolation';
    subEl.textContent = "Don't worry — try again and win something amazing!";
  }

  overlay.classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('confettiContainer').innerHTML = '';
  document.getElementById('spinBtn').disabled = false;
}

function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  container.innerHTML = '';
  const colors = ['#1f7a85', '#2a9aaa', '#d0eef1', '#ffffff', '#0f3d43'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    const left = Math.random() * 100;
    const delay = Math.random() * 0.8;
    const size = 6 + Math.random() * 8;
    const isCircle = Math.random() > 0.5;
    piece.style.cssText = `
      left:${left}%;
      background:${color};
      width:${size}px;
      height:${size}px;
      border-radius:${isCircle ? '50%' : '2px'};
      border:${color === '#ffffff' ? '1px solid #1f7a85' : 'none'};
      animation-delay:${delay}s;
      animation-duration:${1.2 + Math.random() * 0.8}s;
    `;
    container.appendChild(piece);
  }
}

// Resize handling — covers window resize, and iPad/iPhone orientation
// changes (Safari can report stale innerWidth/innerHeight right after
// rotating, so this re-checks shortly after the event fires).
function handleResize() {
  setupCanvas();
  drawWheel(currentAngle);
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', () => {
  setTimeout(handleResize, 300);
});

</script>
</body>
</html>
